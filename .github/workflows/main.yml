name: Smart Commit Processor

on:
  push:
    branches:
      - "**"

jobs:
  process-smart-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Firebase Admin
        run: npm install firebase-admin

      - name: Estrarre messaggio commit
        id: commitmsg
        run: echo "msg=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT

      - name: Process Smart Commit (Firestore Admin)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          COMMIT_MESSAGE: ${{ steps.commitmsg.outputs.msg }}
        run: |
          node << 'EOF'
          const admin = require('firebase-admin');

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          const db = admin.firestore();
          const msg = process.env.COMMIT_MESSAGE;

          console.log("Commit message:", msg);

          // 1. Trova OP-X nel commit
          const match = msg.match(/OP-\d+/);
          if (!match) {
            console.log("Nessun task ID OP-X trovato");
            process.exit(0);
          }

          const opId = match[0];
          console.log("Trovato OP-ID:", opId);

          // 2. Cerca il documento Firestore tramite titolo
          async function run() {
            const snap = await db.collection("tasks")
              .where("title", ">=", opId)
              .where("title", "<=", opId + "\uf8ff")
              .get();

            if (snap.empty) {
              console.log("Nessun documento trovato con title che inizia con:", opId);
              return;
            }

            const doc = snap.docs[0];
            const docId = doc.id;

            console.log("Documento trovato:", docId);

            // 3. Aggiorna lo stato a proposal
            await db.collection("tasks").doc(docId).update({
              status: "proposal",
              "rawData.status": "proposal",
              "rawData.Status": "proposal"
            });

            console.log("Aggiornato:", docId, "→ proposal");
          }

          run();
          EOF
